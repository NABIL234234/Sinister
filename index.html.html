<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сеанс</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=VT323&display=swap">
<style>
:root{--ink:#e8e2d6;--dim:#8a847a;--red:#c2121c;--red2:#7d0a10;--type:"Special Elite","Courier New",monospace;--mono:"VT323","Courier New",monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:#050506;color:var(--ink);font-family:var(--type);overflow:hidden;padding-inline:16px;box-sizing:border-box}
#bg{position:fixed;inset:0;z-index:0;animation:flick 7s infinite}
#bg svg{width:100%;height:100%}
#moon{animation:mp 4.5s ease-in-out infinite}@keyframes mp{50%{opacity:.7}}
.fog{position:absolute;inset:-10%;background:radial-gradient(50% 30% at 30% 70%,rgba(190,195,205,.16),transparent),radial-gradient(45% 25% at 75% 85%,rgba(190,195,205,.14),transparent);animation:drift 22s ease-in-out infinite alternate}
.fog.b{animation-duration:31s;animation-direction:alternate-reverse;opacity:.8}
@keyframes drift{to{transform:translateX(14%)}}
@keyframes flick{0%,92%,96%,100%{filter:brightness(1)}93%{filter:brightness(.35)}95%{filter:brightness(.6)}}
#win{animation:win 5s infinite}
@keyframes win{0%,100%{opacity:.9}20%{opacity:.35}22%{opacity:.95}60%{opacity:.5}62%{opacity:.1}64%{opacity:.9}}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(90% 70% at 50% 45%,transparent 30%,rgba(0,0,0,.7))}
.gr{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.2;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain .5s steps(3) infinite}
.sl{position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px)}
@keyframes grain{33%{transform:translate(-4%,3%)}66%{transform:translate(3%,-4%)}}
main{position:relative;z-index:2;height:100%;display:grid;place-items:center}
.step{width:100%;max-width:400px;max-height:96%;overflow:auto;background:rgba(10,8,8,.82);border:1px solid #2c2222;border-radius:6px;padding:22px 18px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;box-shadow:0 0 70px -10px rgba(194,18,28,.4);backdrop-filter:blur(2px);animation:on .6s steps(6)}
@keyframes on{0%{opacity:0;transform:scaleY(.02)}60%{opacity:1;transform:scaleY(1.04)}}
h1,h2{margin:0;font-weight:400;text-transform:uppercase;letter-spacing:.05em;text-wrap:balance}
h1{font-size:2rem;line-height:1.1;color:var(--red);animation:gl 3.5s infinite}
h2{font-size:1.35rem}
@keyframes gl{0%,90%,100%{text-shadow:none}92%{text-shadow:3px 0 #0ff,-3px 0 var(--red)}95%{text-shadow:-3px 0 #0ff,3px 0 var(--red)}}
p{margin:0;line-height:1.55;font-size:.97rem}.dim{color:var(--dim);font-size:.85rem}
button{font-family:var(--type);font-size:.95rem;color:var(--ink);background:var(--red2);border:1px solid var(--red);padding:12px 18px;border-radius:3px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
button:hover:not(:disabled){background:var(--red)}button:active{transform:scale(.96)}button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button.ghost{background:transparent;border-color:#444;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* ouija */
.board{position:relative;width:100%;box-sizing:border-box;padding:14px 8px;border-radius:10px;border:3px solid #5a3b1e;background:linear-gradient(135deg,#3a2614,#22150a);color:#d8c391;box-shadow:inset 0 0 40px #000}
.board{animation:cand 2.6s infinite}@keyframes cand{0%,100%{box-shadow:inset 0 0 40px #000,0 0 30px rgba(255,150,60,.12)}40%{box-shadow:inset 0 0 40px #000,0 0 48px rgba(255,150,60,.3)}70%{box-shadow:inset 0 0 40px #000,0 0 22px rgba(255,150,60,.08)}}
.yn{display:flex;justify-content:space-between;padding:0 14px 8px;font-size:1.05rem;letter-spacing:.1em}
.g{display:grid;grid-template-columns:repeat(11,1fr);gap:4px 0;font-size:1rem;margin-top:4px}
.g.n{grid-template-columns:repeat(10,1fr);margin-top:10px}
.g span,.yn span{padding:3px 0;transition:.3s}
.lit{color:#fff;text-shadow:0 0 10px #ff3b3b,0 0 20px #c2121c;transform:scale(1.35)}
.pl{position:absolute;left:0;top:0;width:54px;height:54px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:rgba(14,9,5,.82);border:2px solid #8a6a3a;transition:transform 1s cubic-bezier(.5,0,.3,1);pointer-events:none;box-shadow:0 8px 14px rgba(0,0,0,.6)}
.pl::after{content:"";position:absolute;left:50%;top:44%;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid #8a6a3a;background:rgba(200,180,140,.12)}
.out{font-family:var(--mono);font-size:1.5rem;letter-spacing:.2em;color:var(--red);min-height:1.6rem}
.sh{animation:sh .4s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
a.btn{font-family:var(--type);font-size:.95rem;color:var(--ink);background:var(--red2);border:1px solid var(--red);padding:12px 18px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;text-decoration:none}
.stamp{justify-self:center;border:3px solid var(--red);color:var(--red);font-size:1.25rem;padding:2px 12px;letter-spacing:.1em;animation:slam .5s .4s both}
@keyframes slam{0%{opacity:0;transform:rotate(-7deg) scale(2.4)}100%{opacity:1;transform:rotate(-7deg) scale(1)}}
.mm{position:fixed;left:50%;top:12%;transform:translateX(-50%);width:min(320px,86vw);z-index:25;background:rgba(0,0,0,.88);border:1px solid var(--red);color:#ffd9d9;font-family:var(--mono);font-size:1.35rem;line-height:1.3;padding:12px 16px;border-radius:4px;text-align:center;box-sizing:border-box}
.ticket{width:100%;border:2px dashed var(--red);border-radius:6px;padding:16px 12px;box-sizing:border-box;background:#190a0b;display:grid;gap:6px;text-align:left}
.ticket .t{font-size:1.6rem;color:var(--red);letter-spacing:.08em;text-align:center}
.ticket .l{font-family:var(--mono);font-size:1.15rem;color:var(--dim)}
.flash{position:fixed;inset:0;z-index:20;background:#000;display:grid;place-items:center;font-size:34vmin;color:var(--red);animation:fl .1s steps(2) 8}
@keyframes fl{50%{background:#fff;color:#000}}
#mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:30;padding:8px 11px;font-size:1rem;display:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style></head>
<body>
<div id="bg">
<svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0d12"/><stop offset=".7" stop-color="#1b1a1c"/><stop offset="1" stop-color="#0b0a0a"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="9"/></filter></defs>
<rect width="400" height="800" fill="url(#sk)"/>
<g id="moon"><circle cx="270" cy="110" r="72" fill="#9fb0c4" opacity=".2" filter="url(#bl)"/><circle cx="270" cy="110" r="38" fill="#dfe6ee" opacity=".93"/><circle cx="259" cy="102" r="7" fill="#b9c3cf" opacity=".6"/><circle cx="281" cy="121" r="5" fill="#b9c3cf" opacity=".5"/><circle cx="277" cy="97" r="3.5" fill="#b9c3cf" opacity=".5"/></g>
<g stroke="#000" stroke-linecap="round" fill="none"><path stroke-width="14" d="M60 800 C62 640 52 560 64 470"/><path stroke-width="8" d="M62 560 C30 520 20 480 8 440M60 520 C100 490 112 450 104 405M64 480 C50 440 62 400 48 360M64 480 C88 440 84 390 102 350M30 505 C14 500 6 480 0 470M104 430 C124 420 138 410 150 392"/><path stroke-width="4" d="M48 365 C40 345 44 330 34 318M102 355 C112 340 108 325 120 312M8 445 C-2 435 0 420 -8 410"/></g>
<path d="M170 800 V610 L255 545 L340 610 V800Z" fill="#000"/><path d="M250 545 V515 H268 V556Z" fill="#000"/>
<rect id="win" x="238" y="640" width="24" height="34" fill="#e9b35a"/><rect x="249" y="640" width="2" height="34" fill="#000"/><rect x="238" y="656" width="24" height="2" fill="#000"/>
<g id="fig" opacity="0"><path d="M118 683a7 8 0 1 1 .01 0zM111 699h14l4 64h-22z" fill="#000"/><circle cx="115.5" cy="682" r="1.3" fill="#fff"/><circle cx="120.5" cy="682" r="1.3" fill="#fff"/></g>
<rect y="760" width="400" height="40" fill="#000"/>
</svg>
<div class="fog"></div><div class="fog b"></div></div>
<div class="vig"></div><div class="gr"></div><div class="sl"></div>
<button id="mute" class="ghost" onclick="toggleMute()" aria-label="Звук">🔊</button>
<main id="app"></main>
<script>
/* ===== МЕНЯЙ ЗДЕСЬ (ответы духа — ЗАГЛАВНЫМИ буквами, цифры можно) ===== */
const NAME="Мээрим";
const ANS=["ПРИХОДИ","ВОСКРЕСЕНЬЕ 1800","СИНИСТЕР"];
const WHEN="Воскресенье, 18:00", WHERE="Тёмная комната, плед, свет выключен", SNACK="Твои любимые чипсы с солью, с меня";
const DAY=0, HOUR=18; /* день недели (0=вс, 5=пт) и час для обратного отсчёта */
const QS=["Чего ты хочешь?","Когда?","Какой фильм?"];
/* ================================================================== */
const app=document.getElementById("app");let step=0,asked=0,busy=false;
const go=n=>{step=n;render()};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---- звук: синтез в браузере, файлов нет ---- */
let ac,master,muted=false;
function startAudio(){
  if(ac){ac.resume();return}
  ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.55;master.connect(ac.destination);
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=260;lp.connect(master);
  const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.07;lg.gain.value=140;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
  [[55,"sawtooth"],[55.8,"sawtooth"],[82.6,"sine"],[110.9,"triangle"],[58.3,"sine"]].forEach(([f,t])=>{
    const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;o.connect(g);g.connect(lp);o.start()});
  const nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const ns=ac.createBufferSource();ns.buffer=nb;ns.loop=true;const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=500;bp.Q.value=.6;
  const ng=ac.createGain();ng.gain.value=.05;const l2=ac.createOscillator(),l2g=ac.createGain();l2.frequency.value=.12;l2g.gain.value=.035;l2.connect(l2g);l2g.connect(ng.gain);l2.start();
  ns.connect(bp);bp.connect(ng);ng.connect(master);ns.start();
  setInterval(heart,1250);(function eerie(){setTimeout(()=>{tone();eerie()},6000+Math.random()*7000)})();
}
function thump(t,v){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(35,t+.12);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
function heart(){if(!ac||ac.state!=="running")return;const t=ac.currentTime;thump(t,.5);thump(t+.22,.35)}
function tone(){if(!ac||ac.state!=="running")return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain(),f=1100+Math.random()*900;
  o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.94,t+4);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1.6);g.gain.linearRampToValueAtTime(0,t+4);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+4.2)}
function scream(){if(!ac)return;const t=ac.currentTime,g=ac.createGain();g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+1.4);g.connect(master);
  [220,233,311,466,523,1397].forEach(f=>{const o=ac.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.5,t+1.2);o.connect(g);o.start(t);o.stop(t+1.4)});
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=nb;s.connect(g);s.start(t)}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.55;document.getElementById("mute").textContent=muted?"🔇":"🔊"}
function begin(){try{startAudio()}catch(e){}document.getElementById("mute").style.display="block";asked=0;nn=0;busy=false;go(4)}

/* ---- экраны ---- */
const rows=["АБВГДЕЁЖЗИЙ","КЛМНОПРСТУФ","ХЦЧШЩЪЫЬЭЮЯ"];
const steps=[
()=>`<p class="dim">ПРЕДУПРЕЖДЕНИЕ</p><h1>Сеанс для ${NAME}</h1>
 <p>Надень наушники и выключи свет.<br>Звук обязателен 🔊</p><button onclick="begin()">Войти</button>`,
()=>`<h2>Спроси у духа</h2>
 <div class="board" id="bd"><div class="yn"><span data-c="ДА">ДА</span><span data-c="НЕТ">НЕТ</span></div>
 ${["АБВГДЕЁЖЗИК","ЛМНОПРСТУФХ","ЦЧШЩЪЫЬЭЮЯ"].map(r=>`<div class="g">${[...r].map(c=>`<span data-c="${c}">${c}</span>`).join("")}</div>`).join("")}
 <div class="g n">${[..."1234567890"].map(c=>`<span data-c="${c}">${c}</span>`).join("")}</div><div class="pl" id="pl"></div></div>
 <div class="out" id="out"></div>
 <div class="row" id="qs">${QS.map((q,i)=>`<button onclick="ask(${i},this)">${q}</button>`).join("")}</div>`,
()=>`<p class="dim">Дух хочет задать вопрос</p><h2>${NAME}, ты придёшь?</h2>
 <div class="row"><button onclick="yes()">Да</button><button class="ghost" id="no" onclick="no()">Нет</button></div><p class="dim" id="h">&nbsp;</p>`,
()=>`<h1 style="animation:none">Дело открыто</h1>
 <div class="ticket"><div class="t">ДЕЛО №13</div><div class="stamp">ПРИГЛАШЕНА</div>
 <div class="l">СУБЪЕКТ</div><div>${NAME}</div><div class="l">ФИЛЬМ</div><div>Синистер</div>
 <div class="l">ВРЕМЯ СЕАНСА</div><div>${WHEN}</div><div class="l">МЕСТО</div><div>${WHERE}</div>
 <div class="l">ПРИЛОЖЕНО</div><div>${SNACK}</div><div class="l">ДО СЕАНСА</div><div id="cd" style="font-family:var(--mono);font-size:1.4rem;color:var(--red)">&nbsp;</div></div>
 ${nn>=5?'<p class="dim">Отказалась 5 раз. Дух впечатлён.</p>':''}
 <a class="btn" target="_blank" rel="noopener" href="https://t.me/NabilSarzanov?text=${encodeURIComponent("Приду 👁")}">Ответить: приду 👁</a>
 <p class="dim">Бояться нечего, я буду рядом.<br>P.S. Попробуй нажать на луну.</p><button class="ghost" onclick="go(0)">Ещё раз</button>`,
()=>`<p class="dim">Поздний вечер. В квартире тихо.</p><div class="out" id="kn" style="min-height:2.4rem;font-size:2rem">&nbsp;</div>
 <p id="tx" style="min-height:5.5rem"></p><div class="row" id="ib"></div>`
];
function render(){app.innerHTML=`<section class="step">${steps[step]()}</section>`;clearInterval(cdT);if(step===1)home();if(step===4)intro();if(step===3){cd();cdT=setInterval(cd,1000)}}
let cdT;
function cd(){const el=document.getElementById("cd");if(!el)return;const n=new Date(),t=new Date(n);t.setHours(HOUR,0,0,0);t.setDate(n.getDate()+((DAY-n.getDay()+7)%7));if(t<=n)t.setDate(t.getDate()+7);
  const s=Math.floor((t-n)/1000);el.textContent=Math.floor(s/86400)+"д "+Math.floor(s%86400/3600)+"ч "+Math.floor(s%3600/60)+"м "+(s%60)+"с"}
function peek(){const f=document.getElementById("fig");if(!f)return;f.style.opacity=1;setTimeout(()=>f.style.opacity=0,240)}
function whisper(){if(!ac||ac.state!=="running")return;const t=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*.7,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type="bandpass";f.frequency.value=2800+Math.random()*1500;f.Q.value=1.4;const g=ac.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09,t+.3);g.gain.linearRampToValueAtTime(0,t+.7);s.connect(f);f.connect(g);g.connect(master);s.start(t)}
/* далёкий детский смех: синтез гласных "а" (форманты), не запись */
function laugh(vol){if(!ac||ac.state!=="running")return;const t0=ac.currentTime,out=ac.createGain();out.gain.value=vol||.6;
  const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;out.connect(lp);
  const dl=ac.createDelay();dl.delayTime.value=.21;const fb=ac.createGain();fb.gain.value=.4;dl.connect(fb);fb.connect(dl);lp.connect(dl);dl.connect(master);
  let end=lp;if(ac.createStereoPanner){const pn=ac.createStereoPanner();pn.pan.value=Math.random()<.5?-.8:.8;lp.connect(pn);pn.connect(master)}else lp.connect(master);
  for(let i=0;i<6;i++){const t=t0+i*.18,o=ac.createOscillator(),f0=560-i*16+Math.random()*25;o.type="sawtooth";
    o.frequency.setValueAtTime(f0*1.12,t);o.frequency.exponentialRampToValueAtTime(f0*.86,t+.14);
    const a=ac.createBiquadFilter(),b=ac.createBiquadFilter(),g=ac.createGain();a.type=b.type="bandpass";a.frequency.value=950;b.frequency.value=2400;a.Q.value=5;b.Q.value=6;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1.3-i*.12,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(a);o.connect(b);a.connect(g);b.connect(g);g.connect(out);o.start(t);o.stop(t+.18)}}
function knock(){if(!ac||ac.state!=="running")return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.setValueAtTime(190,t);o.frequency.exponentialRampToValueAtTime(65,t+.1);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2)}
async function typeTo(el,text,ms){el.textContent="";for(const ch of text){if(!document.body.contains(el))return false;el.textContent+=ch;await sleep(ms)}return true}
async function intro(){
  const kn=document.getElementById("kn"),tx=document.getElementById("tx"),ib=document.getElementById("ib"),st=document.querySelector(".step");
  setTimeout(()=>laugh(.55),700);
  await sleep(3400);
  for(let i=0;i<3;i++){knock();kn.textContent=(i?kn.textContent+" ":"")+"ТУК";st.classList.remove("sh");void st.offsetWidth;st.classList.add("sh");if(navigator.vibrate)navigator.vibrate(80);await sleep(i===1?1300:800)}
  await sleep(900);
  if(!await typeTo(tx,"Кто-то стучит в дверь. В такое время никого не ждёшь…",40))return;
  ib.innerHTML=`<button id="who">Спросить: «Кто там?»</button>`;
  document.getElementById("who").onclick=async()=>{
    ib.innerHTML="";tx.style.color="";if(!await typeTo(tx,"— Кто там?",55))return;await sleep(2200);
    tx.style.color="var(--red)";tx.style.fontFamily="var(--mono)";tx.style.fontSize="1.25rem";tone();
    if(!await typeTo(tx,"— Я пришёл по приказу моего хозяина. Он хочет пригласить вас на фильм.",65))return;
    await sleep(700);ib.innerHTML=`<button onclick="go(1)">Впустить</button>`}}
function pos(el,jit){const b=document.getElementById("bd"),pl=document.getElementById("pl"),r=el.getBoundingClientRect(),br=b.getBoundingClientRect();
  const j=jit?Math.random()*6-3:0;pl.style.transform=`translate(${r.left-br.left+r.width/2-27+j}px,${r.top-br.top+r.height/2-22+j}px)`}
function home(){const b=document.getElementById("bd");
  const pl=document.getElementById("pl"),br=b.getBoundingClientRect();pl.style.transform=`translate(${br.width/2-27}px,${br.height/2-27}px)`}
async function ask(i,btn){
  if(busy)return;busy=true;btn.disabled=true;const out=document.getElementById("out");out.textContent="";
  document.querySelectorAll("#qs button").forEach(b=>b.disabled=true);
  await sleep(900);
  for(const ch of ANS[i]){
    if(ch===" "){out.textContent+="\u00a0";await sleep(460);continue}
    const el=document.querySelector(`#bd [data-c="${ch}"]`);if(!el)continue;
    pos(el,true);await sleep(1060);el.classList.add("lit");whisper();out.textContent+=ch;await sleep(415);el.classList.remove("lit")}
  await sleep(500);home();asked++;busy=false;if(asked===2)peek();
  btn.dataset.done="1";document.querySelectorAll("#qs button").forEach(b=>b.disabled=b.dataset.done==="1");
  if(asked===3){document.getElementById("qs").innerHTML=`<button onclick="go(2)">Дух хочет спросить тебя</button>`}
}
let nn=0;
function strobe(){const b=document.getElementById("bg");b.style.animationDuration=".5s";setTimeout(()=>b.style.animationDuration="",1800)}
function blackout(){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;z-index:19;background:#000;opacity:0;transition:opacity .5s";document.body.appendChild(d);
  requestAnimationFrame(()=>d.style.opacity=1);if(ac&&ac.state==="running"){thump(ac.currentTime,.9);thump(ac.currentTime+.3,.7)}
  setTimeout(()=>d.style.opacity=0,1400);setTimeout(()=>d.remove(),2000)}
function no(){const s=document.querySelector(".step");s.classList.remove("sh");void s.offsetWidth;s.classList.add("sh");
  const h=document.getElementById("h");nn++;
  if(nn===1){h.textContent="Дух не принимает ответ «нет»";tone()}
  else if(nn===2){h.textContent="Дух смотрит на тебя";peek();strobe();tone()}
  else if(nn===3){h.textContent="Дух злится…";peek();strobe();if(ac&&ac.state==="running")thump(ac.currentTime,.8)}
  else if(nn===4){h.textContent="Свет гаснет…";blackout()}
  else{const d=document.createElement("div");d.className="flash";d.textContent="👁";document.body.appendChild(d);scream();if(navigator.vibrate)navigator.vibrate([200,80,300]);
    setTimeout(()=>{d.remove();h.style.color="var(--red)";h.textContent="Ладно, ладно. Дух пошутил. Остался один ответ.";const b=document.getElementById("no");if(b)b.remove()},900)}}
/* пасхалка: луна на фоне */
document.addEventListener("click",e=>{if(e.target.closest("button,a"))return;
  const W=innerWidth,H=innerHeight,k=Math.max(W/400,H/800),x=(W-400*k)/2+270*k,y=H-800*k+110*k;
  if(Math.hypot(e.clientX-x,e.clientY-y)>56*k)return;
  document.querySelectorAll(".mm").forEach(m=>m.remove());if(ac)tone();
  const d=document.createElement("div");d.className="mm";document.body.appendChild(d);d.onclick=()=>d.remove();
  typeTo(d,"Хозяин просил передать: главное, не пшикай на меня перцовкой при встрече 🙏",45);setTimeout(()=>d.remove(),9000)});
function yes(){const d=document.createElement("div");d.className="flash";d.textContent="👁";document.body.appendChild(d);scream();
  if(navigator.vibrate)navigator.vibrate([200,80,300]);setTimeout(()=>{d.remove();go(3)},900)}
render();
</script>
</body></html>
